<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cap Web — départ</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <h1>Cap Web</h1>
    </header>
    <main>
      <section aria-labelledby="titre-chat">
        <h2 id="titre-chat">Discussion</h2>
        <ul id="messages" aria-label="Messages" aria-live="polite"></ul>
        <form id="chat-form">
          <label for="message">Votre message</label>
          <textarea id="message" name="message" rows="3" required maxlength="280"></textarea>
          <button type="submit">Envoyer</button>
        </form>
        <button type="button" id="effacer">Effacer la conversation</button>
        <button type="button" id="theme">Changer le thème</button>
        <button type="button" id="exporter">Exporter la conversation</button>
      </section>
      <p id="status" role="status"></p>
    </main>
    <footer>
      <span id="version">Version en attente</span>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
