<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetQuiz — révisions réseaux</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <h1>NetQuiz 🌐</h1>
    </header>
    <main>
      <section aria-labelledby="titre-chat">
        <h2 id="titre-chat">Discussion</h2>
        <p id="accueil"></p>
        <div id="suggestions" aria-label="Questions suggérées"></div>
        <ul id="messages" aria-label="Messages" aria-live="polite"></ul>
        <p id="en-attente" class="bulle-attente" hidden aria-live="polite"></p>
        <form id="chat-form">
          <label for="message">Votre message</label>
          <div class="saisie">
            <textarea id="message" name="message" rows="3" required maxlength="280" placeholder="Entrée pour envoyer, Maj+Entrée pour aller à la ligne"></textarea>
            <button type="submit" class="principal">Envoyer</button>
          </div>
        </form>
        <div class="actions">
          <button type="button" id="effacer" class="secondaire">Effacer la conversation</button>
          <button type="button" id="theme" class="secondaire">Changer le thème</button>
          <button type="button" id="exporter" class="secondaire">Exporter la conversation</button>
        </div>
      </section>
      <p id="status" role="status"></p>
    </main>
    <footer>
      <span id="version">Version en attente</span>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
